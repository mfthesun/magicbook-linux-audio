# DKMS package: rebuilds the fixed HDA Realtek module automatically for every new kernel.
PACKAGE_NAME="honor-dra-fix"
PACKAGE_VERSION="2.2"
_mm=$(echo "${kernelver}" | grep -oE '^[0-9]+\.[0-9]+'); _maj=${_mm%%.*}; _min=${_mm#*.}
if [ "${_maj:-0}" -gt 6 ] || { [ "${_maj:-0}" -eq 6 ] && [ "${_min:-0}" -ge 17 ]; }; then
  BUILT_MODULE_NAME[0]="snd-hda-codec-alc269"      # Linux >= 6.17 (sound/hda/codecs/realtek)
else
  BUILT_MODULE_NAME[0]="snd-hda-codec-realtek"     # Linux <  6.17 (sound/pci/hda)
fi
BUILT_MODULE_LOCATION[0]="out/"
DEST_MODULE_LOCATION[0]="/updates/dkms"
MAKE[0]="./build.sh ${kernelver} ${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/out"
CLEAN="rm -rf out"
AUTOINSTALL="yes"
